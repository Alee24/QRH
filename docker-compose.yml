services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hotel_qr_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-grand-heritage-jwt-secret-key-2026-production}
      - DARAJA_CONSUMER_KEY=${DARAJA_CONSUMER_KEY:-sandbox_key}
      - DARAJA_CONSUMER_SECRET=${DARAJA_CONSUMER_SECRET:-sandbox_secret}
      - DARAJA_SHORTCODE=${DARAJA_SHORTCODE:-174379}
      - DARAJA_PASSKEY=${DARAJA_PASSKEY:-bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919}
    volumes:
      - server_data:/app/data
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hotel_qr_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  server_data:
    driver: local

networks:
  hotel_network:
    driver: bridge

