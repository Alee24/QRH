services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sironi_backend
    restart: unless-stopped
    expose:
      - "5000"
    ports:
      - "2638:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DOMAIN=sironi.kkdes.co.ke
      - JWT_SECRET=${JWT_SECRET:-sironi-restaurants-jwt-secret-key-2026}
      - DARAJA_CONSUMER_KEY=${DARAJA_CONSUMER_KEY:-sandbox_key}
      - DARAJA_CONSUMER_SECRET=${DARAJA_CONSUMER_SECRET:-sandbox_secret}
      - DARAJA_SHORTCODE=${DARAJA_SHORTCODE:-174379}
      - DARAJA_PASSKEY=${DARAJA_PASSKEY:-bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919}
    volumes:
      - sironi_db_data:/app/data
    networks:
      - sironi_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sironi_web
    restart: unless-stopped
    ports:
      - "1269:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - sironi_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sironi_db_data:
    external: true

networks:
  sironi_network:
    name: sironi_network
    driver: bridge
